[workspace]
resolver = "3"
members = [
    "bins/orki-cli",
    "bins/orki-stub",
    "crates/orki-core",
    "crates/orki-gfx",
    "crates/orki-net",
    "crates/orki-pack",
    "crates/orki-platform",
    "crates/orki-plugin",
    "crates/orki-schema",
    "crates/orki-script",
    "crates/orki-tauri",
    "crates/orki-ui",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
authors = ["jaszkus"]
repository = "https://github.com/jaszkus/OrkiInstaller"
homepage = "https://github.com/jaszkus/OrkiInstaller"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
postcard = "1"
crc32fast = "1"
blake3 = "1"

[workspace.lints.rust]
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
uninlined_format_args = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = false

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
