version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      wgpu:
        patterns:
          - "wgpu"
          - "naga"
          - "wgpu-*"
      iced:
        patterns:
          - "iced*"
          - "tiny-skia*"
          - "lyon*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
