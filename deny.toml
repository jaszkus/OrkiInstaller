[graph]
all-features = true

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "openssl-sys" },
    { name = "libz-sys" },
    { name = "zstd-sys" },
    { name = "lzma-sys" },
    { name = "bzip2-sys" },
    { name = "aws-lc-sys" },
    { name = "aws-lc-rs" },
    { name = "ring" },
    { name = "cc" },
    { name = "cmake" },
    { name = "bindgen" },
    { name = "pkg-config" },
]
skip-tree = []

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
