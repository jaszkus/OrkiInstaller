[graph]
all-features = true

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "openssl-sys" },
    { name = "libz-sys" },
    { name = "zstd-sys" },
    { name = "lzma-sys" },
    { name = "bzip2-sys" },
    { name = "aws-lc-sys" },
    { name = "aws-lc-rs" },
    { name = "ring" },
    { name = "cmake" },
    { name = "bindgen" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is a transitive dep of postcard via heapless; unmaintained but no safe upgrade; tracked in docs/dependency-waivers.md" },
    { id = "RUSTSEC-2024-0436", reason = "paste is a proc-macro helper of wgpu (wgpu-types bitflags backend); unmaintained but no safe upgrade; tracked in docs/dependency-waivers.md" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is a transitive dep of iced via cosmic-text/fontdb; unmaintained, successor skrifa not wired into iced 0.14; tracked in docs/dependency-waivers.md" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
